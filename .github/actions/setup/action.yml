name: setup
description: >-
  Node 22 with node_modules restored from cache. Installs only when the
  lockfile (or Node version) changed; then the Prisma client is generated.

runs:
  using: composite
  steps:
    - id: node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # Cache node_modules itself, not ~/.npm. Measured: `npm ci` was the single
    # slowest step in every job (24–30s on a runner, even with ~/.npm warm);
    # restoring the ~350MB archive is a few seconds. The key is the exact Node
    # version + lockfile, so native modules can never be reused across ABIs and
    # any dependency change falls back to a clean `npm ci`.
    - id: nm
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}
        # Nearly every feature PR changes the lockfile, so the exact key missed
        # on every PR (and again on main after the merge: a PR's cache is not
        # visible to main). A cold `npm ci` was ~25s of the setup step. Fall
        # back to the newest node_modules for the same Node version instead.
        restore-keys: |
          node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-

    # Exact hit: nothing to do. Partial hit: `npm install` brings the restored
    # tree in line with the lockfile, fetching only what changed (`npm ci`
    # would delete node_modules first). Measured on 4 cores, #10's tree → #11's
    # lockfile: 2s vs 12s, and the same package set as a clean `npm ci`.
    # `npm ci --dry-run` (~1s, touches nothing) keeps `npm ci`'s guarantee: a
    # lockfile out of sync with package.json fails here. Do NOT check with
    # `git diff` after `npm install`: on a stale restored tree npm rewrites
    # harmless metadata (`devOptional` → `dev`) in a perfectly valid lockfile
    # (PR #14 went red on exactly that), so the rewrite is discarded instead.
    - if: steps.nm.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [ -d node_modules ]; then
          npm ci --dry-run --ignore-scripts --no-audit --fund=false >/dev/null \
            || { echo "::error::package-lock.json is out of sync with package.json — run npm install and commit it"; exit 1; }
          npm install --no-audit --fund=false
          git checkout -- package-lock.json
        else
          npm ci --no-audit --fund=false
        fi

    # Always: the generated client lives outside node_modules and is gitignored.
    - shell: bash
      run: npm run db:generate
