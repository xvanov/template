name: setup
description: >-
  Node 22 with node_modules restored from cache. `npm ci` runs only when the
  lockfile (or Node version) changed; then the Prisma client is generated.

runs:
  using: composite
  steps:
    - id: node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # Cache node_modules itself, not ~/.npm. Measured: `npm ci` was the single
    # slowest step in every job (24–30s on a runner, even with ~/.npm warm);
    # restoring the ~350MB archive is a few seconds. The key is the exact Node
    # version + lockfile, so native modules can never be reused across ABIs and
    # any dependency change falls back to a clean `npm ci`.
    - id: nm
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

    - if: steps.nm.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit --fund=false

    # Always: the generated client lives outside node_modules and is gitignored.
    - shell: bash
      run: npm run db:generate
