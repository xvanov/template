[package]
name = "desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Desktop shell (Tauri 2) around the web app: tray, notifications, autostart, updater."
license = "MIT"
publish = false

[lib]
# `desktop_lib`, not `desktop`: on Windows a lib and a bin of the same name
# collide in the target dir (tauri's own template does the same).
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
tauri = { version = "=2.12.6", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-notification = "=2.8.1"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ureq = "=3.5.2"
url = "=2.5.8"

[dev-dependencies]
tauri = { version = "=2.12.6", features = ["tray-icon", "test"] }

[profile.release]
codegen-units = 4
lto = "thin"
strip = true
