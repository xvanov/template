# The ML sidecar: training, evaluation, experiments and the worker bridge.
# NOT an npm workspace and not part of `make test`; its own CI is
# .github/workflows/ml.yml. Always run through uv: `uv run <script>`.
[project]
name = "mlkit"
version = "0.1.0"
description = "ML sidecar for the app template: config, device check, status file, fixed splits, experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1",
]

[project.scripts]
train = "mlkit.train:main"
predict = "mlkit.predict:main"
exp = "mlkit.experiments:main"
device = "mlkit.device:main"
status = "mlkit.status:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
